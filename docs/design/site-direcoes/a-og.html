<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>OG · Direção A</title>
    <style>
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(../../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(../../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url(../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2)
          format('woff2');
      }
      :root {
        --surface-0: #0f1a24;
        --surface-1: #172534;
        --surface-2: #20334a;
        --line: #2e4458;
        --ink: #f2f5f7;
        --ink-muted: #a3b3c0;
        --grass: #2fb866;
        --on-grass: #06200f;
        --grass-soft: #1b4a33;
        --floodlight: #ffc83d;
        --on-floodlight: #1c1500;
        --danger: #ff6b6b;
        --draw: #c3ced6;
        --info: #5fb0ff;
        --focus: #ffc83d;
        --pitch: #1e6b3f;
        --pitch-line: #9fdcb6;
        --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        --font-body: 'Barlow', system-ui, sans-serif;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;
        --touch: 44px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-pill: 999px;
        --layout-content-max: 720px;
        --layout-wide-max: 1040px;
        color-scheme: dark;
        --beam: rgba(255, 214, 120, 0.22);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --surface-0: #f3f5f7;
          --surface-1: #ffffff;
          --surface-2: #e6ebf0;
          --line: #cfd8e0;
          --ink: #10202c;
          --ink-muted: #4e6170;
          --grass: #177a42;
          --on-grass: #ffffff;
          --grass-soft: #d9f2e3;
          --floodlight: #f0b429;
          --on-floodlight: #1c1500;
          --danger: #c62828;
          --draw: #51626f;
          --info: #1565c0;
          --focus: #1565c0;
          --pitch: #2d8f55;
          --pitch-line: #eaf7ef;
          color-scheme: light;
        }
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0f1a24;
        color: #f2f5f7;
        font-family: var(--font-display);
      }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        text-align: center;
      }
      .og::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(45% 60% at 8% 0%, var(--beam), transparent 70%),
          radial-gradient(45% 60% at 92% 0%, var(--beam), transparent 70%),
          linear-gradient(120deg, transparent 32%, var(--beam) 45%, transparent 56%),
          linear-gradient(240deg, transparent 32%, var(--beam) 45%, transparent 56%);
      }
      .top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #ffc83d;
      }
      .name {
        position: absolute;
        top: 66px;
        left: 0;
        right: 0;
        font: 700 40px/1 var(--font-display);
        letter-spacing: 8px;
        text-transform: uppercase;
        color: #ffc83d;
      }
      h1 {
        position: absolute;
        top: 132px;
        left: 285px;
        width: 630px;
        margin: 0;
        font: 800 84px/0.9 var(--font-display);
        text-transform: uppercase;
        text-shadow: 0 0 50px var(--beam);
      }
      .pitch {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 1200px;
        height: 230px;
      }
      .squad {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 44px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 28px;
      }
      .squad .shield {
        width: 96px;
        height: auto;
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.5));
      }
      .squad .shield:nth-child(2),
      .squad .shield:nth-child(3) {
        margin-bottom: 22px;
      }
      .tower {
        position: absolute;
        top: 30px;
        width: 120px;
      }
      .tower-l {
        left: 40px;
      }
      .tower-r {
        right: 40px;
      }
    </style>
  </head>
  <body class="og-a">
    <div class="og">
      <div class="top"></div>
      <svg class="tower tower-l" viewBox="0 0 120 90" aria-hidden="true">
        <rect
          x="8"
          y="8"
          width="104"
          height="52"
          rx="6"
          fill="var(--surface-2)"
          stroke="var(--line)"
          stroke-width="2"
        />
        <circle cx="26" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="26" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="49" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="49" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="72" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="72" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="95" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="95" cy="44" r="7" fill="var(--floodlight)" />
        <rect x="56" y="60" width="8" height="30" fill="var(--line)" /></svg
      ><svg class="tower tower-r" viewBox="0 0 120 90" aria-hidden="true">
        <rect
          x="8"
          y="8"
          width="104"
          height="52"
          rx="6"
          fill="var(--surface-2)"
          stroke="var(--line)"
          stroke-width="2"
        />
        <circle cx="26" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="26" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="49" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="49" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="72" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="72" cy="44" r="7" fill="var(--floodlight)" />
        <circle cx="95" cy="24" r="7" fill="var(--floodlight)" />
        <circle cx="95" cy="44" r="7" fill="var(--floodlight)" />
        <rect x="56" y="60" width="8" height="30" fill="var(--line)" />
      </svg>
      <div class="name">Prancheta</div>
      <h1>O Brasil inteiro na prancheta</h1>
      <svg class="pitch" viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="pitch-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--pitch)" stop-opacity="0" />
            <stop offset=".35" stop-color="var(--pitch)" />
          </linearGradient>
        </defs>
        <path d="M140 0H860L1000 260H0Z" fill="url(#pitch-fade)" />
        <path d="M140 0H212L100 260H0Z" fill="#ffffff" opacity=".035" />
        <path d="M284 0H356L300 260H200Z" fill="#ffffff" opacity=".035" />
        <path d="M428 0H500L500 260H400Z" fill="#ffffff" opacity=".035" />
        <path d="M572 0H644L700 260H600Z" fill="#ffffff" opacity=".035" />
        <path d="M716 0H788L900 260H800Z" fill="#ffffff" opacity=".035" />
        <g fill="none" stroke="var(--pitch-line)" stroke-width="3" opacity=".75">
          <path d="M120 40H880" />
          <path d="M500 40V260" />
          <ellipse cx="500" cy="150" rx="150" ry="62" />
          <circle cx="500" cy="150" r="5" fill="var(--pitch-line)" />
        </g>
      </svg>
      <div class="squad">
        <svg
          class="shield"
          viewBox="0 0 64 72"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="32" cy="36" r="30" fill="#FFFFFF" />
          <rect x="2" y="26" width="60" height="20" fill="#006437" />
          <circle cx="32" cy="36" r="30" fill="none" stroke="var(--ink)" stroke-width="2" />
          <polygon
            points="32,22 35.5,31 45,31 37.5,36.5 40.5,46 32,40 23.5,46 26.5,36.5 19,31 28.5,31"
            fill="var(--ink)"
          /></svg
        ><svg
          class="shield"
          viewBox="0 0 64 72"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M32 2 60 16v24c0 14-12 24-28 28C16 64 4 54 4 40V16Z" fill="#C8102E" />
          <path d="M4 40 60 16v24c0 14-12 24-28 28C16 64 4 54 4 40Z" fill="#111417" />
          <path
            d="M32 2 60 16v24c0 14-12 24-28 28C16 64 4 54 4 40V16Z"
            fill="none"
            stroke="var(--ink)"
            stroke-width="2"
          />
          <polygon
            points="32,22 35.5,31 45,31 37.5,36.5 40.5,46 32,40 23.5,46 26.5,36.5 19,31 28.5,31"
            fill="var(--ink)"
          /></svg
        ><svg
          class="shield"
          viewBox="0 0 64 72"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="32" cy="36" r="30" fill="#FFFFFF" />
          <rect x="2" y="26" width="60" height="20" fill="#0033A0" />
          <circle cx="32" cy="36" r="30" fill="none" stroke="var(--ink)" stroke-width="2" />
          <circle cx="32" cy="38" r="8" fill="var(--ink)" /></svg
        ><svg
          class="shield"
          viewBox="0 0 64 72"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="32" cy="36" r="30" fill="#0A7A3D" />
          <rect x="2" y="26" width="60" height="20" fill="#FFD400" />
          <circle cx="32" cy="36" r="30" fill="none" stroke="var(--ink)" stroke-width="2" />
          <circle cx="32" cy="38" r="8" fill="var(--ink)" />
        </svg>
      </div>
    </div>
  </body>
</html>
