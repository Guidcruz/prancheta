<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" width="360" height="474" role="img" aria-labelledby="t d"><title id="t">Regra das estrelas do escudo</title><desc id="d">Cada título vale uma estrela pequena e cada cinco títulos viram uma estrela grande: 12 títulos são 2 estrelas grandes e 2 pequenas. Na Série A as estrelas são douradas e na Série B, prateadas.</desc><rect width="360" height="474" rx="16" fill="#0f1a24"/><text x="180" y="38" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f5f7" text-anchor="middle">Estrelas do escudo</text><text x="180" y="64" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="500" fill="#a3b3c0" text-anchor="middle">1 título = 1 estrela pequena</text><text x="180" y="86" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="500" fill="#a3b3c0" text-anchor="middle">5 títulos = 1 estrela grande</text><rect x="20" y="102" width="320" height="70" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="180" y="130" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="700" fill="#f2f5f7" text-anchor="middle">12 títulos =</text><text x="180" y="160" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffc83d" text-anchor="middle">2 grandes + 2 pequenas</text><rect x="20" y="188" width="320" height="128" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="34" y="218" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffc83d" text-anchor="start">Série A: douradas</text><text x="34" y="240" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3b3c0" text-anchor="start">No jogo desde já</text><polygon points="112.0,252.0 119.1,272.3 140.5,272.7 123.4,285.7 129.6,306.3 112.0,294.0 94.4,306.3 100.6,285.7 83.5,272.7 104.9,272.3" fill="#ffc83d" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="178.0,252.0 185.1,272.3 206.5,272.7 189.4,285.7 195.6,306.3 178.0,294.0 160.4,306.3 166.6,285.7 149.5,272.7 170.9,272.3" fill="#ffc83d" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="240.0,265.0 244.0,276.5 256.2,276.7 246.5,284.1 250.0,295.8 240.0,288.8 230.0,295.8 233.5,284.1 223.8,276.7 236.0,276.5" fill="#ffc83d" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="280.0,265.0 284.0,276.5 296.2,276.7 286.5,284.1 290.0,295.8 280.0,288.8 270.0,295.8 273.5,284.1 263.8,276.7 276.0,276.5" fill="#ffc83d" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><rect x="20" y="330" width="320" height="128" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="34" y="360" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="19" font-weight="700" fill="#c3ced6" text-anchor="start">Série B: prateadas</text><text x="34" y="382" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3b3c0" text-anchor="start">Ainda não está no jogo</text><polygon points="112.0,394.0 119.1,414.3 140.5,414.7 123.4,427.7 129.6,448.3 112.0,436.0 94.4,448.3 100.6,427.7 83.5,414.7 104.9,414.3" fill="#c3ced6" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="178.0,394.0 185.1,414.3 206.5,414.7 189.4,427.7 195.6,448.3 178.0,436.0 160.4,448.3 166.6,427.7 149.5,414.7 170.9,414.3" fill="#c3ced6" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="240.0,407.0 244.0,418.5 256.2,418.7 246.5,426.1 250.0,437.8 240.0,430.8 230.0,437.8 233.5,426.1 223.8,418.7 236.0,418.5" fill="#c3ced6" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/><polygon points="280.0,407.0 284.0,418.5 296.2,418.7 286.5,426.1 290.0,437.8 280.0,430.8 270.0,437.8 273.5,426.1 263.8,418.7 276.0,418.5" fill="#c3ced6" stroke="#0f1a24" stroke-width="1" stroke-linejoin="round"/></svg>
