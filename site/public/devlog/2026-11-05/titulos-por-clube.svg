<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 782" width="360" height="782" role="img" aria-labelledby="t d"><title id="t">Títulos por clube em 1.000 temporadas simuladas</title><desc id="d">Flamingo 259 títulos, Palmeral 182, Cruzador 131, Fluminário 96, Tufão 76, Baião 72, Minério 51, Santões 33, Bragantão 26, Coritibom 18, São Paulão 16, Botafogueira 14, Vitorioso 7, Vasconcelos 6, Grêmeos 5, Inter-Regional 3, Miragol 3, Corinto 2. Remador e Chapecão, os dois mais fracos, não ganharam nenhum.</desc><rect width="360" height="782" rx="16" fill="#0f1a24"/><text x="180" y="34" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" fill="#f2f5f7" text-anchor="middle">Títulos em 1.000 temporadas</text><text x="180" y="58" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3b3c0" text-anchor="middle">cada clube, com a força entre parênteses</text><text x="12" y="102" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#f2f5f7" text-anchor="start">Flamingo (78)</text><rect x="140" y="88" width="130" height="18" rx="4" fill="#ffc83d"/><text x="276" y="102" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffc83d" text-anchor="start">259</text><text x="12" y="132" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#f2f5f7" text-anchor="start">Palmeral (77)</text><rect x="140" y="118" width="91.35135135135135" height="18" rx="4" fill="#ffc83d"/><text x="237.35135135135135" y="132" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffc83d" text-anchor="start">182</text><text x="12" y="162" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#f2f5f7" text-anchor="start">Cruzador (76)</text><rect x="140" y="