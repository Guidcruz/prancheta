<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" width="360" height="424" role="img" aria-labelledby="t d"><title id="t">Coritibom com a IA padrão e com o técnico-robô</title><desc id="d">Em 1.000 temporadas pareadas, o Coritibom faz 51,7 pontos com a IA padrão e 55,8 com o técnico-robô. O título sai de 1,8% para 4,0% e o G4, de 12,2% para 22,1%.</desc><rect width="360" height="424" rx="16" fill="#0f1a24"/><text x="180" y="34" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="21" font-weight="700" fill="#f2f5f7" text-anchor="middle">Coritibom: IA contra técnico-robô</text><text x="180" y="56" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3b3c0" text-anchor="middle">1.000 temporadas pareadas, mesmas sementes</text><rect x="12" y="78" width="336" height="94" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="24" y="102" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f5f7" text-anchor="start">Pontos na tabela</text><text x="24" y="128" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">IA</text><rect x="64" y="114" width="189.56666666666666" height="16" rx="4" fill="#5b7a94"/><text x="259.56666666666666" y="128" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f5f7" text-anchor="start">51,7</text><text x="24" y="154" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">Robô</text><rect x="64" y="140" width="204.6" height="16" rx="4" fill="#2fb866"/><text x="274.6" y="154" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#2fb866" text-anchor="start">55,8</text><rect x="12" y="182" width="336" height="94" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="24" y="206" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f5f7" text-anchor="start">Título (%)</text><text x="24" y="232" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">IA</text><rect x="64" y="218" width="66" height="16" rx="4" fill="#5b7a94"/><text x="136" y="232" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f5f7" text-anchor="start">1,8%</text><text x="24" y="258" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">Robô</text><rect x="64" y="244" width="146.66666666666666" height="16" rx="4" fill="#2fb866"/><text x="216.66666666666666" y="258" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#2fb866" text-anchor="start">4,0%</text><rect x="12" y="286" width="336" height="94" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="24" y="310" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f5f7" text-anchor="start">No G4 (%)</text><text x="24" y="336" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">IA</text><rect x="64" y="322" width="89.46666666666665" height="16" rx="4" fill="#5b7a94"/><text x="159.46666666666664" y="336" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f5f7" text-anchor="start">12,2%</text><text x="24" y="362" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="start">Robô</text><rect x="64" y="348" width="162.06666666666666" height="16" rx="4" fill="#2fb866"/><text x="232.06666666666666" y="362" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" fill="#2fb866" text-anchor="start">22,1%</text><text x="180" y="408" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="middle">Mais pontos, mais título e G4, sem virar potência.</text></svg>