<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 472" width="360" height="472" role="img" aria-labelledby="t d"><title id="t">Como um minuto de partida é calculado</title><desc id="d">Fluxograma: força de meio e ataque contra defesa dá cerca de 9% de chance de oportunidade; com oportunidade, finalizador contra goleiro dá gol (cerca de 15%), defesa, trave ou fora; cartões, lesões e cansaço são sorteados em paralelo.</desc><rect width="360" height="472" rx="16" fill="#0f1a24"/><text x="180" y="38" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="700" fill="#f2f5f7" text-anchor="middle">Um minuto, para cada time</text><rect x="20" y="56" width="320" height="86" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="180" y="84" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="19" font-weight="600" fill="#f2f5f7" text-anchor="middle">Meio + ataque contra defesa</text><text x="180" y="116" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffc83d" text-anchor="middle">chance de lance: ~9%</text><text x="180" y="134" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" font-weight="500" fill="#a3b3c0" text-anchor="middle">em jogo equilibrado</text><path d="M180 142V166" stroke="#a3b3c0" stroke-width="3"/><path d="M173 164L180 172L187 164Z" fill="#a3b3c0"/><rect x="20" y="172" width="320" height="60" rx="10" fill="#172534" stroke="#2e4458" stroke-width="2"/><text x="180" y="197" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="600" fill="#f2f5f7" text-anchor="middle">Saiu oportunidade?</text><text x="180" y="220" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="500" fill="#a3b3c0" text-anchor="middle">Finalizador contra goleiro</text><path d="M180 232V256" stroke="#a3b3c0" stroke-width="3"/><path d="M173 254L180 262L187 254Z" fill="#a3b3c0"/><rect x="20" y="262" width="76" height="78" rx="10" fill="#1b4a33" stroke="#2fb866" stroke-width="2"/><text x="58" y="292" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f5f7" text-anchor="middle">GOL</text><text x="58" y="324" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" fill="#2fb866" text-anchor="middle">~15%</text><rect x="101" y="262" width="76" height="78" rx="10" fill="#172534" stroke="#5fb0ff" stroke-width="2"/><text x="139" y="292" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#5fb0ff" text-anchor="middle">DEFESA</text><rect x="182" y="262" width="76" height="78" rx="10" fill="#172534" stroke="#ffc83d" stroke-width="2"/><text x="220" y="292" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffc83d" text-anchor="middle">TRAVE</text><rect x="263" y="262" width="76" height="78" rx="10" fill="#172534" stroke="#a3b3c0" stroke-width="2"/><text x="301" y="292" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15" font-weight="700" fill="#a3b3c0" text-anchor="middle">FORA</text><line x1="20" y1="366" x2="340" y2="366" stroke="#2e4458" stroke-width="2" stroke-dasharray="6 6"/><text x="180" y="390" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="16" font-weight="500" fill="#a3b3c0" text-anchor="middle">Ao mesmo tempo, no mesmo minuto</text><rect x="20" y="404" width="102" height="48" rx="10" fill="#20334a" stroke="#2e4458" stroke-width="2"/><text x="71" y="435" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="18" font-weight="600" fill="#f2f5f7" text-anchor="middle">Cartões</text><rect x="129" y="404" width="102" height="48" rx="10" fill="#20334a" stroke="#2e4458" stroke-width="2"/><text x="180" y="435" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="18" font-weight="600" fill="#f2f5f7" text-anchor="middle">Lesões</text><rect x="238" y="404" width="102" height="48" rx="10" fill="#20334a" stroke="#2e4458" stroke-width="2"/><text x="289" y="435" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="18" font-weight="600" fill="#f2f5f7" text-anchor="middle">Cansaço</text></svg>
