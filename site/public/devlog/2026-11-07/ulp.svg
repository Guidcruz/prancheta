<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" role="img" aria-labelledby="t d"><title id="t">O que é um ulp</title><desc id="d">Uma reta com números representáveis em intervalos iguais. Um valor exato cai entre dois deles. Dois navegadores escolhem vizinhos diferentes, e a diferença entre eles é de 1 ulp.</desc><rect width="360" height="230" rx="16" fill="#0f1a24"/><text x="180" y="34" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f5f7" text-anchor="middle">Um ulp: o passo entre dois vizinhos</text><line x1="30" y1="120" x2="330" y2="120" stroke="#2e4458" stroke-width="3"/><line x1="60" y1="106" x2="60" y2="134" stroke="#a3b3c0" stroke-width="3"/><line x1="140" y1="106" x2="140" y2="134" stroke="#a3b3c0" stroke-width="3"/><line x1="220" y1="106" x2="220" y2="134" stroke="#a3b3c0" stroke-width="3"/><line x1="300" y1="106" x2="300" y2="134" stroke="#a3b3c0" stroke-width="3"/><circle cx="168" cy="120" r="7" fill="#f2f5f7"/><text x="168" y="92" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" fill="#f2f5f7" text-anchor="middle">valor exato</text><text x="140" y="156" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" fill="#2fb866" text-anchor="middle">Node</text><text x="220" y="156" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14" fill="#e8a33d" text-anchor="middle">Chromium</text><path d="M140 168 H220 M140 162 V174 M220 162 V174" stroke="#a3b3c0" stroke-width="2" fill="none"/><text x="180" y="194" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f5f7" text-anchor="middle">1 ulp de diferença</text><text x="180" y="216" font-family="Barlow, 'Segoe UI', system-ui, Arial, sans-serif" font-size="13" fill="#a3b3c0" text-anchor="middle">os dois quase acertam, mas não o último bit</text></svg>
